name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Tests
        run: ./mvnw clean test

      - name: Package
        run: ./mvnw package -DskipTests

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: target/*.jar